[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-agr-toolkit"
version = "0.1.0"
description = "Инструменты формирования ТЭП и совмещения IFC с TRM"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell",
    "pandas",
    "openpyxl",
    "PyMuPDF",
    "PyQt6",
    "qt-material",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

